name: Diag
on: [push]
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - name: Run check in an empty temp dir
        run: |
          bin="$(swift build --show-bin-path)"
          root=$(swift -e 'import Foundation; print(FileManager.default.temporaryDirectory.path)')
          empty="$root/diagcase/empty"
          mkdir -p "$empty"
          cd "$empty"
          echo "cwd: $(pwd -P)"
          set +e
          "$bin/xclocsmith" check > /tmp/out.txt 2> /tmp/err.txt &
          pid=$!
          ( sleep 60; kill -9 $pid 2>/dev/null ) &
          watcher=$!
          start=$SECONDS
          wait $pid; status=$?
          kill $watcher 2>/dev/null
          echo "exit=$status after $((SECONDS-start))s"
          echo "--- stdout ---"; head -5 /tmp/out.txt
          echo "--- stderr ---"; head -5 /tmp/err.txt
      - name: Sample the process if it is stuck
        run: |
          bin="$(swift build --show-bin-path)"
          root=$(swift -e 'import Foundation; print(FileManager.default.temporaryDirectory.path)')
          empty="$root/diagcase2/empty"; mkdir -p "$empty"; cd "$empty"
          set +e
          "$bin/xclocsmith" check > /dev/null 2>&1 &
          pid=$!
          sleep 12
          if kill -0 $pid 2>/dev/null; then
            echo "STILL RUNNING after 12s — sampling"
            sample $pid 5 -file /tmp/sample.txt 2>/dev/null || true
            sed -n '1,80p' /tmp/sample.txt
            ps -o rss=,vsz= -p $pid
            kill -9 $pid
          else
            wait $pid; echo "finished, exit=$?"
          fi
