name: Diag
on: [push]
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - name: Locate and run
        run: |
          bin="$(swift build --show-bin-path)"
          echo "bin path: $bin"
          ls -la "$bin" | head -20
          root=$(swift -e 'import Foundation; print(FileManager.default.temporaryDirectory.path)')
          empty="$root/diagcase/empty"
          mkdir -p "$empty"
          cd "$empty"
          echo "--- run (30s cap) ---"
          set +e
          /usr/bin/time -p timeout 30 "$bin/xclocsmith" check
          echo "exit=$?"
          echo "--- with an explicit root ---"
          /usr/bin/time -p timeout 30 "$bin/xclocsmith" check --no-config
          echo "exit=$?"
      - name: The failing test alone, with a cap
        run: |
          set +e
          timeout 300 swift test --filter testProjectWithNoCatalogsIsAnErrorNotACleanRun 2>&1 | tail -20
          echo "exit=$?"
