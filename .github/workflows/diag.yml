name: Diag
on: [push]
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - name: Isolate
        run: |
          bin="$(swift build --show-bin-path)"
          root=$(swift -e 'import Foundation; print(FileManager.default.temporaryDirectory.path)')
          empty="$root/case/empty"; mkdir -p "$empty"; cd "$empty"
          echo "shell pwd -P : $(pwd -P)"
          swift -e 'import Foundation; print("currentDirectoryPath:", FileManager.default.currentDirectoryPath)'
          echo "entries here: $(ls -A | wc -l)"

          echo "=== A: --no-config (skips the upward config search) ==="
          "$bin/xclocsmith" check --no-config > /tmp/a.out 2>/tmp/a.err &
          pid=$!; ( sleep 25; kill -9 $pid 2>/dev/null ) & w=$!
          s=$SECONDS; wait $pid; echo "exit=$? after $((SECONDS-s))s"; kill $w 2>/dev/null
          head -3 /tmp/a.err

          echo "=== B: default (does the upward config search) ==="
          "$bin/xclocsmith" check > /tmp/b.out 2>/tmp/b.err &
          pid=$!
          sleep 15
          if kill -0 $pid 2>/dev/null; then
            echo "stuck; full sample follows"
            sample $pid 3 -file /tmp/s.txt >/dev/null 2>&1
            grep -E "in xclocsmith\)|Binary Images|^Call graph" /tmp/s.txt | head -40
            ps -o rss= -p $pid
            kill -9 $pid
          else
            wait $pid; echo "exit=$?"; head -3 /tmp/b.err
          fi
